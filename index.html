<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMessenger</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .hidden {
            display: none !important;
        }

        /* LOGIN */

        #authPage {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        #authPage h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 15px;
            cursor: pointer;
            font-size: 15px;
        }

        .authButton {
            width: 100%;
            background: #0084ff;
            color: white;
            margin-bottom: 8px;
        }

        .authButton:hover {
            background: #0073df;
        }

        #authError {
            color: #d00;
            margin-top: 10px;
            text-align: center;
        }

        /* MESSENGER */

        #messengerPage {
            height: 100vh;
            display: flex;
        }

        #sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        #sidebarHeader {
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        #sidebarHeader h2 {
            margin: 0 0 5px 0;
        }

        #currentUser {
            color: #777;
            font-size: 14px;
        }

        #logoutButton {
            margin-top: 12px;
            background: #eee;
            width: 100%;
        }

        #usersList {
            overflow-y: auto;
            flex: 1;
        }

        .userItem {
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .userItem:hover {
            background: #f5f5f5;
        }

        .userItem.selected {
            background: #e7f3ff;
        }

        /* CHAT */

        #chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #chatHeader {
            height: 65px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .myMessage {
            align-self: flex-end;
            background: #0084ff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .theirMessage {
            align-self: flex-start;
            background: white;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        #sendArea {
            background: white;
            padding: 12px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
        }

        #messageInput {
            flex: 1;
            margin: 0;
        }

        #sendButton {
            background: #0084ff;
            color: white;
            min-width: 80px;
        }

        #sendButton:hover {
            background: #0073df;
        }

        #noChat {
            margin: auto;
            color: #777;
            font-size: 18px;
        }

        #connectionStatus {
            font-size: 12px;
            margin-top: 5px;
        }

        .online {
            color: green;
        }

        .offline {
            color: red;
        }
    </style>
</head>

<body>

<!-- ========================= -->
<!-- AUTH PAGE -->
<!-- ========================= -->

<div id="authPage">

    <h1>MyMessenger</h1>

    <input
        id="usernameInput"
        type="text"
        placeholder="Имя пользователя"
        autocomplete="username"
    >

    <input
        id="passwordInput"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
    >

    <button class="authButton" onclick="login()">
        Войти
    </button>

    <button class="authButton" onclick="register()">
        Создать аккаунт
    </button>

    <div id="authError"></div>

</div>


<!-- ========================= -->
<!-- MESSENGER -->
<!-- ========================= -->

<div id="messengerPage" class="hidden">

    <div id="sidebar">

        <div id="sidebarHeader">

            <h2>MyMessenger</h2>

            <div id="currentUser"></div>

            <div id="connectionStatus" class="offline">
                ● Подключение...
            </div>

            <button id="logoutButton" onclick="logout()">
                Выйти
            </button>

        </div>

        <div id="usersList"></div>

    </div>


    <div id="chat">

        <div id="chatHeader">
            Выберите пользователя
        </div>

        <div id="messages">

            <div id="noChat">
                Выберите пользователя слева
            </div>

        </div>

        <div id="sendArea" class="hidden">

            <input
                id="messageInput"
                type="text"
                placeholder="Введите сообщение..."
                onkeydown="handleEnter(event)"
            >

            <button id="sendButton" onclick="sendMessage()">
                Отправить
            </button>

        </div>

    </div>

</div>


<script>

let currentUsername = null;
let selectedUser = null;
let websocket = null;


/* =========================
   AUTH
========================= */

async function register() {

    const username =
        document.getElementById("usernameInput").value.trim();

    const password =
        document.getElementById("passwordInput").value;

    const error =
        document.getElementById("authError");

    error.textContent = "";

    if (!username || !password) {
        error.textContent = "Введите имя и пароль";
        return;
    }

    const response = await fetch("/register", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            username: username,
            password: password
        })

    });

    const data = await response.json();

    if (data.error) {
        error.textContent = data.error;
        return;
    }

    currentUsername = data.username;

    enterMessenger();
}


async function login() {

    const username =
        document.getElementById("usernameInput").value.trim();

    const password =
        document.getElementById("passwordInput").value;

    const error =
        document.getElementById("authError");

    error.textContent = "";

    if (!username || !password) {
        error.textContent = "Введите имя и пароль";
        return;
    }

    const response = await fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            username: username,
            password: password
        })

    });

    const data = await response.json();

    if (data.error) {
        error.textContent = data.error;
        return;
    }

    currentUsername = data.username;

    enterMessenger();
}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

    const response = await fetch("/me");

    const data = await response.json();

    if (!data.error) {

        currentUsername = data.username;

        enterMessenger();
    }
}


/* =========================
   ENTER MESSENGER
========================= */

function enterMessenger() {

    document
        .getElementById("authPage")
        .classList.add("hidden");

    document
        .getElementById("messengerPage")
        .classList.remove("hidden");

    document
        .getElementById("currentUser")
        .textContent = "Вы: " + currentUsername;

    loadUsers();

    connectWebSocket();
}


/* =========================
   WEBSOCKET
========================= */

function connectWebSocket() {

    if (websocket) {

        try {
            websocket.close();
        } catch (e) {}

    }

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    const wsUrl =
        protocol + "//" + location.host + "/ws";

    websocket = new WebSocket(wsUrl);


    websocket.onopen = function() {

        console.log("WebSocket подключён");

        const status =
            document.getElementById("connectionStatus");

        status.textContent = "● Онлайн";
        status.className = "online";
    };


    websocket.onmessage = function(event) {

        const message = JSON.parse(event.data);

        console.log("Новое сообщение:", message);

        /*
         * Если сообщение относится к текущему открытому чату,
         * сразу добавляем его на экран.
         */

        if (
            selectedUser &&
            (
                (
                    message.username === currentUsername &&
                    message.receiver === selectedUser
                )
                ||
                (
                    message.username === selectedUser &&
                    message.receiver === currentUsername
                )
            )
        ) {

            addMessageToScreen(message);

            scrollMessagesToBottom();
        }

    };


    websocket.onclose = function() {

        console.log("WebSocket отключён");

        const status =
            document.getElementById("connectionStatus");

        status.textContent = "● Нет соединения";
        status.className = "offline";


        /*
         * Если соединение случайно оборвалось,
         * пробуем подключиться снова через 2 секунды.
         */

        setTimeout(function() {

            if (
                document
                    .getElementById("messengerPage")
                    .classList
                    .contains("hidden")
            ) {
                return;
            }

            connectWebSocket();

        }, 2000);

    };


    websocket.onerror = function(error) {

        console.log("WebSocket ошибка:", error);

    };
}


/* =========================
   LOAD USERS
========================= */

async function loadUsers() {

    const response = await fetch("/users");

    const users = await response.json();

    const usersList =
        document.getElementById("usersList");

    usersList.innerHTML = "";

    users.forEach(user => {

        if (user.username === currentUsername) {
            return;
        }

        const element =
            document.createElement("div");

        element.className = "userItem";

        element.textContent = user.username;

        element.onclick = function() {

            selectUser(user.username);
        };

        usersList.appendChild(element);

    });
}


/* =========================
   SELECT USER
========================= */

function selectUser(username) {

    selectedUser = username;

    document
        .getElementById("chatHeader")
        .textContent = username;

    document
        .getElementById("sendArea")
        .classList
        .remove("hidden");

    document
        .getElementById("noChat")
        .classList
        .add("hidden");


    document
        .querySelectorAll(".userItem")
        .forEach(element => {

            if (element.textContent === username) {

                element.classList.add("selected");

            } else {

                element.classList.remove("selected");

            }

        });


    loadMessages();
}


/* =========================
   LOAD OLD MESSAGES
========================= */

async function loadMessages() {

    if (!selectedUser) {
        return;
    }

    const response = await fetch(
        "/messages?receiver=" +
        encodeURIComponent(selectedUser)
    );

    const messages = await response.json();

    const container =
        document.getElementById("messages");

    container.innerHTML = "";

    messages.forEach(message => {

        addMessageToScreen(message);

    });

    scrollMessagesToBottom();
}


/* =========================
   ADD MESSAGE
========================= */

function addMessageToScreen(message) {

    const container =
        document.getElementById("messages");

    /*
     * Защита от дублирования.
     */

    const existing =
        document.querySelector(
            `[data-message-id="${message.id}"]`
        );

    if (existing) {
        return;
    }


    const element =
        document.createElement("div");

    element.classList.add("message");

    element.dataset.messageId = message.id;


    if (message.username === currentUsername) {

        element.classList.add("myMessage");

    } else {

        element.classList.add("theirMessage");

    }


    element.textContent = message.text;

    container.appendChild(element);
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    if (!selectedUser) {
        return;
    }

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    input.value = "";


    const response = await fetch("/messages", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            text: text,

            receiver: selectedUser

        })

    });


    const data = await response.json();


    if (data.error) {

        alert(data.error);

        return;
    }


    /*
     * Само сообщение здесь НЕ добавляем.
     *
     * Сервер отправит его обратно через WebSocket,
     * и websocket.onmessage() добавит его на экран.
     */
}


/* =========================
   ENTER TO SEND
========================= */

function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================
   SCROLL
========================= */

function scrollMessagesToBottom() {

    const container =
        document.getElementById("messages");

    container.scrollTop =
        container.scrollHeight;
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    if (websocket) {

        try {
            websocket.close();
        } catch (e) {}

        websocket = null;
    }


    await fetch("/logout", {
        method: "POST"
    });


    currentUsername = null;
    selectedUser = null;


    document
        .getElementById("messengerPage")
        .classList
        .add("hidden");

    document
        .getElementById("authPage")
        .classList
        .remove("hidden");


    document
        .getElementById("usernameInput")
        .value = "";

    document
        .getElementById("passwordInput")
        .value = "";

    document
        .getElementById("authError")
        .textContent = "";
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
